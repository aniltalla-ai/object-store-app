_schema-version: '3.1'
ID: object-store-app
version: 1.0.0

modules:
  - name: object-store-app
    type: nodejs
    path: .
    parameters:
      memory: 256M
      disk-quota: 256M
      buildpack: nodejs_buildpack
    properties:
      PORT: 4004
      NODE_ENV: production
      MOCK_LOCAL_STORAGE: 'false'
      XS_APP_NAME: ${xsappname}
    requires:
      - name: object-store-uaa
    provides:
      - name: object-store-app-api
        properties:
          url: ${default-url}

resources:
  - name: object-store-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: object-store-app
        tenant-mode: dedicated
