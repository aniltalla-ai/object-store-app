<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-preset="slate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gateway & Swagger Explorer</title>
    
    <!-- Modular Theme Stylesheet (Dynamically swapped via JS) -->
    <link id="theme-stylesheet" rel="stylesheet" href="swagger/css/themes/slate.css">
    
    <!-- Shared App Layout & UI Component Styles -->
    <link rel="stylesheet" href="swagger/css/shared.css">

    <!-- Swagger UI Vendor & Custom Overrides -->
    <link rel="stylesheet" href="swagger/css/vendor/swagger-ui.css">
    <link rel="stylesheet" href="swagger/css/swagger-theme.css">
</head>
<body>

    <!-- Shared Top Navigation Header -->
    <header class="top-header">
        <div class="brand-container">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <h1 class="brand-title">API Gateway <span class="brand-tag">Swagger</span></h1>
        </div>

        <div class="header-actions">
            <div class="live-status">
                <span class="pulse-dot"></span> Online
            </div>

            <!-- Theme Preset Selector -->
            <select id="themePresetSelect" class="theme-select" aria-label="Select Theme Preset">
                <option value="slate">Slate (Indigo)</option>
                <option value="cyberpunk">Cyberpunk (Neon)</option>
                <option value="emerald">Emerald (Forest)</option>
                <option value="sunset">Sunset (Burgundy)</option>
            </select>

            <!-- Light/Dark Mode Toggle Button -->
            <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Light/Dark Mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Swagger UI View Container -->
    <main class="swagger-card-wrapper">
        <div class="card-container swagger-card">
            <div id="swagger-ui"></div>
        </div>
    </main>

    <!-- Vendor Scripts -->
    <script src="swagger/js/swagger-ui-bundle.js"></script>
    <script src="swagger/js/swagger-ui-standalone-preset.js"></script>

    <!-- Application Logic -->
    <script src="swagger/js/main.js"></script>
</body>
</html>
