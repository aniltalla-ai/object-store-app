<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-preset="slate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Store App - Documentation</title>

    <!-- Modular Theme Stylesheet (Dynamically swapped via JS) -->
    <link id="theme-stylesheet" rel="stylesheet" href="swagger/css/themes/slate.css">

    <!-- Shared App Layout & UI Component Styles -->
    <link rel="stylesheet" href="swagger/css/shared.css">

    <!-- Swagger UI Vendor & Custom Overrides -->
    <link rel="stylesheet" href="swagger/css/vendor/swagger-ui.css">
    <link rel="stylesheet" href="swagger/css/swagger-theme.css">
</head>

<body>

    <!-- Shared Top Navigation Header -->
    <header class="top-header">
        <div class="brand-container">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>

            <div class="brand-title">
                Object Store App
                <span class="brand-tag">v1.0 API</span>
            </div>
        </div>

        <div class="header-actions">
            <!-- Theme Preset Selector -->
            <select id="themePresetSelect" class="theme-select" aria-label="Select Theme Preset">
                <option value="cyberpunk">Cyberpunk (Neon)</option>
                <option value="slate">Slate (Indigo)</option>
                <option value="emerald">Emerald (Forest)</option>
                <option value="sunset">Sunset (Burgundy)</option>
            </select>

            <!-- Light/Dark Mode Toggle Button -->
            <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Light/Dark Mode">
                <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Swagger UI View Container -->
    <main class="swagger-card-wrapper">
        <div class="card-container swagger-card">
            <div id="swagger-ui"></div>
        </div>
    </main>

    <!-- Vendor Scripts -->
    <script src="swagger/js/swagger-ui-bundle.js"></script>
    <script src="swagger/js/swagger-ui-standalone-preset.js"></script>

    <!-- Application Logic -->
    <script src="swagger/js/main.js"></script>
</body>

</html>
