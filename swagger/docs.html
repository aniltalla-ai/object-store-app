<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Store App - Documentation</title>
  <link rel="stylesheet" href="/swagger/github-markdown.min.css">
  <script src="/swagger/marked.min.js"></script>
  <style>
    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (max-width: 767px) {
      body { padding: 15px; }
    }
    .markdown-body {
      background-color: #0d1117;
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <article id="content" class="markdown-body">Loading Documentation...</article>
  <script>
    fetch('/README.md')
      .then(res => res.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<p>Documentation unavailable.</p>';
      });
  </script>
</body>
</html>
